name: Wheels packaging
on:
  workflow_dispatch:
    inputs:
      testsuite:
        type: string
        description: Testsuite to run (none, fast, all)
        required: true
        default: all
      duckdb-python-sha:
        type: string
        description: The commit or ref to build against (defaults to latest commit of current ref)
        required: false
      duckdb-sha:
        type: string
        description: Override the DuckDB submodule commit or ref to build against
        required: false
      set-version:
        description: Force version (vX.Y.Z-((rc|post)N))
        required: false
        type: string

jobs:
  build_wheels:
    name: 'Wheel: ${{ matrix.python }}-${{ matrix.platform.cibw_system }}_${{ matrix.platform.arch }}'
    strategy:
      fail-fast: false
      matrix:
        python: [ cp310 ]
        platform:
          - { os: ubuntu-24.04, arch: x86_64, cibw_system: manylinux }
    runs-on: ${{ matrix.platform.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CIBW_TEST_SKIP: ${{ inputs.testsuite == 'none' && '*' || '*-macosx_universal2' }}
      CIBW_TEST_SOURCES: tests
      CIBW_BEFORE_TEST: >
        uv export --only-group test --no-emit-project  --quiet --output-file pylock.toml --directory {project} &&
        uv pip install -r pylock.toml
      CIBW_TEST_COMMAND: >
        uv run -v pytest --confcutdir=. --rootdir . -c {project}/pyproject.toml ${{ inputs.testsuite == 'fast' && './tests/fast' || './tests' }}
      CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2014"

    steps:
      - name: Checkout DuckDB Python
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.duckdb-python-sha }}
          fetch-depth: 0
          submodules: true

      - name: Checkout DuckDB
        shell: bash
        if: ${{ inputs.duckdb-sha }}
        run: |
          cd external/duckdb
          git fetch origin
          git checkout ${{ inputs.duckdb-sha }}

      # NOTE: everything the Linux build needs in-container must live in ONE
      # CIBW_ENVIRONMENT string. Do NOT also set CIBW_ENVIRONMENT_LINUX in the
      # cibuildwheel step — the platform-specific var *replaces* this one rather
      # than merging, which silently drops CCACHE_DIR and OVERRIDE_GIT_DESCRIBE.
      - name: Set CIBW_ENVIRONMENT
        shell: bash
        run: |
          cibw_env="CCACHE_DIR=/host${{ github.workspace }}/.ccache"
          cibw_env="$cibw_env CMAKE_ARGS=-DDUCKDB_EXPLICIT_PLATFORM=linux_amd64"
          if [[ -n "${{ inputs.set-version }}" ]]; then
            cibw_env="$cibw_env OVERRIDE_GIT_DESCRIBE=${{ inputs.set-version }}"
          fi
          echo "CIBW_ENVIRONMENT=${cibw_env}" >> $GITHUB_ENV

      - name: Setup Ccache
        uses: ./.github/actions/ccache-action
        with:
          key: ${{ matrix.platform.cibw_system }}_${{ matrix.platform.arch }}

      # Install Astral UV, which will be used as build-frontend for cibuildwheel
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.0"
          enable-cache: false
          cache-suffix: -${{ matrix.python }}-${{ matrix.platform.cibw_system }}_${{ matrix.platform.arch }}

      - name: Build${{ inputs.testsuite != 'none' && ' and test ' || ' ' }}wheels
        uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.platform.cibw_system }}_${{ matrix.platform.arch }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}-${{ matrix.platform.cibw_system }}_${{ matrix.platform.arch }}
          path: wheelhouse/*.whl
          compression-level: 0
